[install]
# Bun expects seconds; 259200 = 3 days.
minimumReleaseAge = 259200

# Bun exclusions use exact package names.
minimumReleaseAgeExcludes = [
  # Exact-pinned Polar SDK needed for the billing API migration, including fresh CI installs.
  "@polar-sh/sdk",
  "@cossistant/api",
  "@cossistant/browser",
  "@cossistant/core",
  "@cossistant/example-nextjs-tailwind",
  "@cossistant/facehash-landing",
  "@cossistant/jobs",
  "@cossistant/location",
  "@cossistant/memory",
  "@cossistant/next",
  "@cossistant/protocol",
  "@cossistant/react",
  "@cossistant/redis",
  "@cossistant/release",
  "@cossistant/tiny-markdown",
  "@cossistant/tinybird",
  "@cossistant/transactional",
  "@cossistant/types",
  "@cossistant/typescript-config",
  "@cossistant/web",
  "@cossistant/workers",
  "facehash",
]
